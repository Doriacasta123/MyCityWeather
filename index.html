<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima de mi Ciudad</title>
    <link rel="stylesheet" href="clima.css">
</head>
<body>

    <div class="container">

        <h1>Consulta el Clima</h1>

        <form id="weather-form">
            <input type="text" id="city-input" placeholder="Escribe tu ciudad" required/>
            <button type="submit">Buscar</button>
        </form>


        <div id="weather-result" class="hidden">
            <h2 id="city-name"></h2>
            <p id="temperature"></p>
            <p id="description"></p>
        </div>


    </div>


    <script src="clima.js"></script>
    
</body>
</html>
